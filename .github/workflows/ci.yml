name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # idempotency-spring-boot-starter is not on Maven Central; build this commit.
  IDEMPOTENCY_REV: 050b9a596da6b59dac0de0f78f3a29ec7abc017d

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e "mcp-server[dev]"
      - run: pytest -q mcp-server

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e mcp-server -e "agent[dev]"
      - run: pytest -q agent

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false
      - run: pip install -e mcp-server -e agent -r evals/requirements.txt
      - name: synthetic data is reproducible
        run: python data/generate.py && git diff --exit-code data/
      - name: run evals and enforce thresholds
        run: python evals/run_evals.py --check
      - name: price the traces
        run: evals/cost.sh
      - name: committed results are up to date
        run: git diff --exit-code evals/

  java-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/checkout@v5
        with:
          repository: gratycodes/idempotency-spring-boot-starter
          ref: ${{ env.IDEMPOTENCY_REV }}
          path: .deps/idempotency
      - run: mvn -B -ntp -q -f .deps/idempotency/pom.xml install -DskipTests -pl idempotency-spring-boot-starter -am
      - run: mvn -B -ntp -f disputes-service/pom.xml test

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  integration:
    # Postgres + Kafka as service containers: Java ITs (idempotency, state machine,
    # outbox to Kafka), then the real stack end to end: seeded service, MCP over
    # HTTP, the agent triaging every dispute, and a check against the offline evals.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: disputes
          POSTGRES_USER: disputes
          POSTGRES_PASSWORD: disputes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disputes" --health-interval 2s --health-retries 30
      kafka:
        image: apache/kafka:4.2.2
        ports: ["9092:9092"]
    env:
      IT_DB_URL: jdbc:postgresql://localhost:5432/disputes
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/checkout@v5
        with:
          repository: gratycodes/idempotency-spring-boot-starter
          ref: ${{ env.IDEMPOTENCY_REV }}
          path: .deps/idempotency
      - run: mvn -B -ntp -q -f .deps/idempotency/pom.xml install -DskipTests -pl idempotency-spring-boot-starter -am
      - name: unit + integration tests (mvn verify)
        run: mvn -B -ntp -f disputes-service/pom.xml verify
      - run: pip install -e mcp-server -e agent
      - name: start the service on a fresh database
        run: |
          PGPASSWORD=disputes psql -h localhost -U disputes -d disputes -c "create database e2e"
          DB_URL=jdbc:postgresql://localhost:5432/e2e OUTBOX_PUBLISHER=kafka SEED_PATH=data/seed.json \
            java -jar disputes-service/target/disputes-service-0.1.0-SNAPSHOT.jar > service.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 1; done
          cat service.log; exit 1
      - name: service read models match the fixture the evals use
        run: python scripts/contract_check.py http://localhost:8080
      - name: agent triages every dispute through MCP
        run: dispute-agent --api http://localhost:8080 --pending
      - name: live recommendations match the offline eval
        run: python scripts/live_check.py http://localhost:8080
      - name: outbox drained to Kafka
        run: |
          for i in $(seq 1 30); do
            n=$(PGPASSWORD=disputes psql -h localhost -U disputes -d e2e -tAc "select count(*) from outbox where published_at is null")
            [ "$n" = "0" ] && exit 0; sleep 1
          done
          echo "outbox still has $n unpublished rows"; exit 1
      - if: failure()
        run: cat service.log || true

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - name: agent triages the seeded queue, console proxies the API
        run: |
          for i in $(seq 1 120); do
            n=$(curl -sf "localhost:5173/api/disputes?limit=1" | python3 -c "import json,sys; print(json.load(sys.stdin)['counts'].get('AWAITING_REVIEW',0))" 2>/dev/null || echo 0)
            [ "$n" = "76" ] && echo "76 disputes awaiting review" && exit 0
            sleep 2
          done
          echo "got $n"; exit 1
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
