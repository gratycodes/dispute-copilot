spring:
  application:
    name: disputes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disputes}
    username: ${DB_USER:disputes}
    password: ${DB_PASSWORD:disputes}
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

server:
  port: ${PORT:8080}

idempotency:
  store: jdbc
  scope:
    header: X-Api-Client
  ttl: 24h

copilot:
  seed:
    # Path to data/seed.json; loaded once into an empty database.
    path: ${SEED_PATH:}
  outbox:
    # kafka | log | none
    publisher: ${OUTBOX_PUBLISHER:log}
    topic: dispute-events
    poll-interval: 1s
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
