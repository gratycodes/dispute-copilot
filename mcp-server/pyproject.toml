[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispute-mcp"
version = "0.1.0"
description = "Read-only MCP server exposing dispute, transaction, evidence and policy lookups to a triage agent."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gratus Antin" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dispute-mcp = "dispute_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dispute_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
