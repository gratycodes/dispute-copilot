[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dispute-agent"
version = "0.1.0"
description = "Dispute triage agent: calls MCP tools, recommends accept/represent/request-info with citations. Never acts on its own."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gratus Antin" }]
dependencies = [
  # Pinned to a commit: agent-runtime-kit is not on PyPI.
  "agent-runtime-kit[otel] @ git+https://github.com/gratycodes/agent-runtime-kit@f5ef7694b616fea029414d9c1dda4f088e24b27f",
  "dispute-mcp",
  "mcp>=2.3,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
dispute-agent = "dispute_agent.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dispute_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
